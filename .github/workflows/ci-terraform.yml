name: ci-terraform

# Terraform CI. `validate` comes from the shared terraform.yml; `plan` from the
# shared terraform-deploy.yml, which comments each plan on the PR.
#
# terraform.yml deliberately runs no plan job, and that decision holds for the
# repos it was written for: in azure-landingzone and terraform-root-aks the
# root modules resolve each other with data sources, so a plan against a
# not-yet-applied dependency fails at plan time and reports a CI failure for
# something that is not a defect. This configuration is a single
# self-contained root module and plans cleanly, so it opts in to
# terraform-deploy.yml, the same workflow cd-terraform applies with.
#
# Note stg and prd are planned but deliberately never applied — see
# "Environments" in the README.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Credential-free init and validate. pull-requests: read is what the shared
  # workflow's own path filter needs; it runs inside that workflow, so the
  # permission has to be granted from here.
  terraform:
    permissions:
      contents: read
      pull-requests: read
    uses: jay-withers/workflows/.github/workflows/terraform.yml@0619e50b64233b7132aa7557fb78b2331fd9c5b1 # v1.5.2

  # Plans against Azure using GitHub OIDC, once per environment, through the
  # shared terraform-deploy.yml, which also posts each plan as a PR comment
  # (one per environment, edited in place on every push). cd-terraform calls
  # the same workflow with apply: true, so the PR runs the same init and plan
  # the merge will. Skipped until the AZURE_CLIENT_ID repository variable is
  # set (see README), so the check does not fail before Azure auth is
  # configured. All three environments share one Azure subscription
  # (ARM_SUBSCRIPTION_ID); split per-environment credentials here if that
  # changes.
  #
  # The `changed` output reuses the shared workflow's path filter rather than
  # declaring a second dorny/paths-filter here that would drift from it. The
  # cost is ordering: `needs` waits for the whole called workflow, so this
  # starts after validate rather than beside it. Deliberately not always(): if
  # validate failed, init would fail here for the same reason and three legs of
  # runner time would buy no information the required check has not already
  # reported.
  plan:
    needs: terraform
    if: needs.terraform.outputs.changed == 'true' && vars.AZURE_CLIENT_ID != ''
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, stg, prd]
    permissions:
      id-token: write
      contents: read
      pull-requests: write # the plan comment
    uses: jay-withers/workflows/.github/workflows/terraform-deploy.yml@10a897d48ad51b5ca87f9644b6c425f4fac159f1 # v1.6.0
    with:
      environment: ${{ matrix.environment }}
      client-id: ${{ vars.AZURE_CLIENT_ID }}
      tenant-id: ${{ vars.AZURE_TENANT_ID }}
      subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  # Required status check for the plan job. The shared workflow's own gate
  # ("terraform / Terraform") covers only what runs inside it, so plan needs an
  # always-reporting job of its own or a failed plan could not block a merge.
  #
  # Skipped counts as success: a pull request touching no Terraform, and every
  # pull request until AZURE_CLIENT_ID is set, must pass rather than hang. Mark
  # this check ("terraform-plan") required in the ruleset alongside
  # "terraform / Terraform".
  terraform-plan:
    needs: plan
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the plan job
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          echo "plan=$PLAN_RESULT"
          if [ "$PLAN_RESULT" = "failure" ]; then
            echo "::error::A Terraform plan leg failed."
            exit 1
          fi
